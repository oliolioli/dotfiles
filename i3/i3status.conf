# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
    interval = 1
    colors = true
    output_format = "i3bar"
    color_good = "#44FF31"
    color_degraded = "#FDFF34"
    color_bad = "#FF3431"
}

order += "ddate"
order += "battery 0"
order += "battery 1"
order += "cpu_usage"
order += "wireless wlp58s0"
order += "tztime local"


ddate {
	format = "%A,%e %B,YOLD %Y"
}

tztime local {
        format = "%d/%m/%Y %H:%M:%S"
}

cpu_usage {
    format = "CPU %usage"
}

wireless wlp58s0 {
                   format_up = "%essid%quality|%bitrate|%ip"
                   format_down = "Wifi down"
           }

battery 0 {
                   format = "BAT0: %percentage %status (%remaining>%emptytime)"
                   format_down = "No battery"
				           integer_battery_capacity = "true"
                   status_chr = "⚡"
                   status_bat = "🔋"
                   status_unk = "?"
                   status_full = "☻"
                   path = "/sys/class/power_supply/BAT%d/uevent"
                   low_threshold = 15
           }

battery 1 {
                   format = "BAT1: %status %percentage (%remaining>%emptytime)"
                   format_down = "No battery"
				           integer_battery_capacity = "true"
                   status_chr = "⚡"
                   status_bat = "🔋"
                   status_unk = "?"
                   status_full = "☻"
                   path = "/sys/class/power_supply/BAT%d/uevent"
                   low_threshold = 15
           }
