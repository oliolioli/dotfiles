# Subtle shadows
shadow = true;
shadow-radius = 20;
shadow-opacity = 0.5;
shadow-offset-x = -10;
shadow-offset-y = -10;

# Smooth fading
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;

# Transparency
inactive-opacity = 0.95;
active-opacity = 1.0;
backend = "glx";

# Subtle window shadows
shadow = true;
shadow-radius = 8;
shadow-offset-x = 2;
shadow-offset-y = 3;
shadow-opacity = 0.20;

# Don't shadow desktop or panel
shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

corner-radius = 8;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'"
];
